<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cửa Hàng Online</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>

  <!-- =========================================================
      MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ
      Đây là màn hình đầu tiên người dùng nhìn thấy. Sau khi
      đăng nhập thành công, màn hình này sẽ ẩn đi và màn hình
      cửa hàng bên dưới sẽ hiện ra.
      ========================================================= -->
  <div id="manHinhDangNhap" class="card">
    <h2>Đăng nhập / Đăng ký</h2>
    <input type="text" id="oTaiKhoan" placeholder="Tài khoản" aria-label="Tài khoản" autocomplete="username">
    <input type="password" id="oMatKhau" placeholder="Mật khẩu" aria-label="Mật khẩu" autocomplete="current-password">
    <div class="thong-bao" id="thongBaoLoi" role="status" aria-live="polite"></div>
    <button id="btnDangNhap" type="button" onclick="dangNhap()">Đăng nhập</button>
    <button id="btnDangKy" type="button" onclick="dangKy()">Đăng ký</button>
    <p style="font-size:12px;color:#999;margin-top:12px;">
      Tài khoản mẫu có sẵn: <b>khach1</b> / mật khẩu <b>123456</b>
      <br>Tài khoản đăng ký chỉ được lưu trong phiên mở trang này.
    </p>
  </div>

  <!-- =========================================================
      MÀN HÌNH CỬA HÀNG
      Bị ẩn (display: none) cho đến khi đăng nhập thành công.
      ========================================================= -->
  <div id="manHinhCuaHang" style="display: none;">
    <div class="thanh-tren">
      Xin chào, <b id="tenDangNhap"></b>
      <button type="button" onclick="dangXuat()">Đăng xuất</button>
    </div>

    <h1>Cửa Hàng Online</h1>

    <div class="layout">
      <!-- DANH SÁCH SẢN PHẨM -->
      <div class="card">
        <h2>Danh sách sản phẩm</h2>
        <table>
          <thead>
            <tr>
              <th>Tên sản phẩm</th>
              <th>Giá</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="bangSanPham">
            <!-- JS sẽ điền dữ liệu vào đây -->
          </tbody>
        </table>
      </div>

      <!-- GIỎ HÀNG -->
      <div class="card">
        <h2>Giỏ hàng</h2>
        <div id="bangGioHang">
          <!-- JS sẽ điền dữ liệu vào đây -->
        </div>
        <div class="tong-tien">
          <span>Tổng tiền:</span>
          <span id="tongTien">$0</span>
        </div>
        <button id="btnThanhToan" type="button" onclick="thanhToan()">Thanh toán</button>
      </div>
    </div>
  </div>


  <script src="./main.js"></script>
  </body>
</html>
