<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tính chỉ số BMI</title>
</head>
<body>
	<h1>Tính chỉ số BMI</h1>
	<form id="bmiForm">
		<p>
			<label for="height">Chiều cao (m):</label>
			<input id="height" type="number" min="0" step="any" required>
		</p>
		<p>
			<label for="weight">Cân nặng (kg):</label>
			<input id="weight" type="number" min="0" step="any" required>
		</p>
		<button type="submit">Tính BMI</button>
	</form>
	<p id="result" aria-live="polite"></p>

	<script>
		const bmiForm = document.getElementById("bmiForm");
		const result = document.getElementById("result");

		bmiForm.addEventListener("submit", (event) => {
			event.preventDefault();

			const height = Number(document.getElementById("height").value);
			const weight = Number(document.getElementById("weight").value);
			if (!Number.isFinite(height) || !Number.isFinite(weight) || height <= 0 || weight <= 0) {
				result.textContent = "Vui lòng nhập chiều cao và cân nặng lớn hơn 0.";
				return;
			}

			const bmi = weight / (height * height);
			let category;
			if (bmi < 18.5) {
				category = "Gầy";
			} else if (bmi < 25) {
				category = "Bình thường";
			} else if (bmi < 30) {
				category = "Thừa cân";
			} else {
				category = "Béo phì";
			}

			result.textContent = `BMI: ${bmi.toFixed(2)} - ${category}`;
		});
	</script>
</body>
</html>
